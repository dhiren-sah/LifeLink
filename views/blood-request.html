<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Request</title>

    <link rel="stylesheet" href="/css/blood-request.css">
</head>

<body>

    <div class="container">

        <h2>Blood Request Form</h2>

        <form id="bloodRequestForm">

            <div>
                <label>Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    readonly
                >
            </div>

            <div>
                <label>Phone</label>
                <input
                    type="text"
                    id="phone"
                    readonly
                >
            </div>

            <div>
                <label>Blood Group</label>
                <input
                    type="text"
                    id="bloodGroup"
                    readonly
                >
            </div>

            <div>
                <label>Units Required</label>
                <input
                    type="number"
                    id="units"
                    min="1"
                    required
                >
            </div>

            <div>
                <label>Hospital</label>
                <input
                    type="text"
                    id="hospital"
                    required
                >
            </div>

            <div>
                <label>Reason</label>
                <textarea
                    id="reason"
                    required
                ></textarea>
            </div>

            <div>
                <label>Urgency</label>

                <select id="urgency">

                    <option value="Normal">
                        Normal
                    </option>

                    <option value="Urgent">
                        Urgent
                    </option>

                    <option value="Emergency">
                        Emergency
                    </option>

                </select>

            </div>

            <div>
                <label>Address</label>

                <textarea
                    id="address"
                    required
                ></textarea>

            </div>

            <button type="submit">
                Submit Request
            </button>

        </form>

        <br>

        <button id="logoutButton">
            Logout
        </button>

    </div>

    <script src="/js/blood-request.js"></script>

</body>

</html>
